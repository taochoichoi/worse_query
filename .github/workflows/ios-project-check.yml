
name: iOS Source Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.swift'
      - '**/*.m'
      - '**/*.h'
      - '.github/workflows/ios-project-check.yml'

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Check source files without opening the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          count=$(find . -type f \( -name '*.swift' -o -name '*.m' -o -name '*.h' \) | wc -l | tr -d ' ')
          echo "Found $count Swift/Objective-C source files."
          if [ "$count" -eq 0 ]; then
            echo "No source files found."
            exit 1
          fi
          find . -type f \( -name '*.swift' -o -name '*.m' -o -name '*.h' \) -print
